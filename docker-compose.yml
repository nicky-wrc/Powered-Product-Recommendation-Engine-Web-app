services:
  db:
    image: pgvector/pgvector:pg16
    container_name: recengine-db
    environment:
      POSTGRES_USER: recengine
      POSTGRES_PASSWORD: recengine
      POSTGRES_DB: recengine
    ports:
      - "5433:5432"
    volumes:
      - recengine_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recengine -d recengine"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  recengine_pgdata:
