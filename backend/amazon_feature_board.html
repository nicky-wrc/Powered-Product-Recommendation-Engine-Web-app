function fireFeaturePrompt(featureName, sectionLabel) {
  const message =
    'ออกแบบงานพัฒนาสำหรับฟีเจอร์ "' +
    featureName +
    '" (หมวด: ' +
    sectionLabel +
    ") ให้ระบบ e-commerce แนว Amazon ที่ยังยึดคอนเซ็ปต์ AI: (1) user stories / acceptance criteria (2) API endpoints + auth (3) โมเดลข้อมูลหลัก & indexes (4) จุดที่ใช้ ML/LLM และข้อมูลเทรน (5) ลำดับส่ง MVP";
  if (typeof window !== "undefined" && typeof window.sendPrompt === "function") {
    window.sendPrompt(message);
    return;
  }
  if (typeof navigator !== "undefined" && navigator.clipboard && navigator.clipboard.writeText) {
    void navigator.clipboard.writeText(message).catch(function () {});
  }
  console.log("[Feature board prompt]", message);
}

const diffCount={easy:0,medium:0,hard:0,ai:0,total:0,done:0};
sections.forEach(s=>s.cards.forEach(c=>{
  diffCount.total++;
  if(c.done)diffCount.done++;
  if(c.ai)diffCount.ai++;
  diffCount[c.diff]++;
}));

const statsEl=document.getElementById('stats');
const statsData=[
  {num:sections.length,label:"หมวด / โมดูล",color:"var(--color-text-secondary)"},
  {num:diffCount.total,label:"การ์ดฟีเจอร์",color:"var(--color-text-primary)"},
  {num:diffCount.ai,label:"AI features",color:"var(--color-text-info)"},
  {num:diffCount.hard,label:"ความยาก hard",color:"var(--color-text-danger)"},
  {num:diffCount.done,label:"ทำแล้ว (done)",color:"var(--color-text-success)"},
];
statsData.forEach(s=>{
  const d=document.createElement('div');
  d.className='stat';
  d.innerHTML=`<div class="stat-num" style="color:${s.color}">${s.num}</div><div class="stat-label">${s.label}</div>`;
  statsEl.appendChild(d);
});

let activeFilter='all';
const filterDefs=[
  {id:'all',label:'ทั้งหมด'},
  {id:'ai',label:'AI features'},
  {id:'easy',label:'Easy'},
  {id:'medium',label:'Medium'},
  {id:'hard',label:'Hard'},
];

const filtersEl=document.getElementById('filters');
filterDefs.forEach(f=>{
  const b=document.createElement('button');
  b.className='fbtn'+(f.id==='all'?' active':'');
  b.textContent=f.label;
  b.onclick=()=>{
    activeFilter=f.id;
    document.querySelectorAll('.fbtn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    render();
  };
  filtersEl.appendChild(b);
});

function render(){
  const cont=document.getElementById('board-content');
  cont.innerHTML='';
  sections.forEach(sec=>{
    const filtered=sec.cards.filter(c=>{
      if(activeFilter==='all')return true;
      if(activeFilter==='ai')return c.ai;
      return c.diff===activeFilter;
    });
    if(!filtered.length)return;
    const wrap=document.createElement('div');
    wrap.className='section';
    const title=document.createElement('div');
    title.className='section-title';
    title.innerHTML=`<span style="background:${sec.color}"></span>${sec.label} <span style="font-weight:400;color:var(--color-text-secondary)">${filtered.length}</span>`;
    wrap.appendChild(title);
    const grid=document.createElement('div');
    grid.className='grid';
    filtered.forEach(c=>{
      const card=document.createElement('div');
      card.className='card'+(c.done?' done':'');
      const diffLabel={easy:'Easy',medium:'Medium',hard:'Hard'}[c.diff];
      const aiBadge=c.ai?`<span class="badge ai">AI</span>`:'';
      const diffBadge=`<span class="badge ${c.diff}">${diffLabel}</span>`;
      card.innerHTML=`
        <div class="card-top">
          <i class="ti ${c.icon} card-icon" aria-hidden="true" style="font-size:20px"></i>
          <div style="display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end">${aiBadge}${diffBadge}</div>
        </div>
        <div class="card-name">${c.name}${c.done?' <span style="font-size:11px;color:var(--color-text-success)">✓</span>':''}</div>
        <div class="card-desc">${c.desc}</div>${c.tag ? `<span class="card-tag">${c.tag}</span>` : ""}
      `;
      card.onclick = function () {
        fireFeaturePrompt(c.name, sec.label);
      };
      grid.appendChild(card);
    });
    wrap.appendChild(grid);
    cont.appendChild(wrap);
  });
}
render();
</script>
